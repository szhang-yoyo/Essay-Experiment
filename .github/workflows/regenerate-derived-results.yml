name: Regenerate derived result CSVs

on:
  push:
    branches: [phase3-mpi]
    paths:
      - '.github/workflows/regenerate-derived-results.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase3-mpi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas
      - name: Regenerate derived CSVs from canonical data
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import numpy as np
          import pandas as pd

          PCG_RAW = Path('results/crossover/pcg_canonical_raw_final_validated.csv')
          PCG_QUALITY = Path('results/crossover/pcg_quality_final_validated.csv')
          CG_RAW = Path('results/crossover/cg_canonical_raw.csv')

          OUT_POINT = Path('results/crossover/ratio_point_estimates.csv')
          OUT_BOOT = Path('results/crossover/ratio_bootstrap_ci.csv')
          OUT_TRADE = Path('results/crossover/pcg_tradeoff_final_validated.csv')
          OUT_TABLE = Path('results/tables/table3_overlap_all_comparisons.csv')

          SEED = 20260802
          B = 10000
          CL = 0.95
          ALPHA = (1.0 - CL) / 2.0

          def aliases(df):
              ren = {
                  'n':'grid_size', 'p':'processes', 'runtime':'total_time',
                  'residual':'relative_residual', 'status':'quality_check',
              }
              return df.rename(columns={k:v for k,v in ren.items() if k in df.columns and v not in df.columns})

          pcg = aliases(pd.read_csv(PCG_RAW))
          cg = aliases(pd.read_csv(CG_RAW))
          quality = aliases(pd.read_csv(PCG_QUALITY))

          pcg['method'] = pcg['method'].astype(str).str.upper().str.replace(' ', '', regex=False)
          pcg.loc[pcg['method'].str.startswith('BJ'), 'method'] = 'BJ'
          pcg = pcg[pcg['method'].isin(['BJ','AS1','AS2'])].copy()

          # Canonical CG is keyed by physical (N,p); PCG additionally carries scaling mode.
          cg_keys = ['grid_size','processes']
          pcg_keys = ['scaling','grid_size','processes','method']

          cg_sum = (cg.groupby(cg_keys, as_index=False)
                    .agg(n_CG=('total_time','size'),
                         T_CG_mean_s=('total_time','mean'),
                         k_CG_mean=('iterations','mean')))

          pcg_sum = (pcg.groupby(pcg_keys, as_index=False)
                     .agg(n_M=('total_time','size'),
                          T_M_mean_s=('total_time','mean'),
                          k_M_mean=('iterations','mean')))

          point = pcg_sum.merge(cg_sum, on=cg_keys, how='left', validate='many_to_one')
          point['C_CG_s_per_iter'] = point['T_CG_mean_s'] / point['k_CG_mean']
          point['C_M_s_per_iter'] = point['T_M_mean_s'] / point['k_M_mean']
          point['R_T'] = point['T_M_mean_s'] / point['T_CG_mean_s']
          point['R_k'] = point['k_M_mean'] / point['k_CG_mean']
          point['R_C'] = point['C_M_s_per_iter'] / point['C_CG_s_per_iter']
          point['R_k_times_R_C'] = point['R_k'] * point['R_C']
          point['identity_abs_error'] = (point['R_T'] - point['R_k_times_R_C']).abs()
          point['identity_pass'] = point['identity_abs_error'] <= 1e-12
          point['screening_RT_le_1_20'] = point['R_T'] <= 1.20

          order = ['scaling','grid_size','processes','method','n_CG','n_M',
                   'T_CG_mean_s','T_M_mean_s','k_CG_mean','k_M_mean',
                   'C_CG_s_per_iter','C_M_s_per_iter','R_T','R_k','R_C',
                   'R_k_times_R_C','identity_abs_error','identity_pass',
                   'screening_RT_le_1_20']
          method_order = pd.CategoricalDtype(['BJ','AS1','AS2'], ordered=True)
          point['method'] = point['method'].astype(method_order)
          point = point.sort_values(['scaling','grid_size','processes','method'])
          point['method'] = point['method'].astype(str)
          point[order].to_csv(OUT_POINT, index=False)

          # Percentile bootstrap. Each method configuration and its matched CG
          # baseline are resampled independently, with a deterministic child RNG
          # derived from the published seed and configuration index.
          boot_rows = []
          sorted_configs = point.reset_index(drop=True)
          seed_seq = np.random.SeedSequence(SEED)
          children = seed_seq.spawn(len(sorted_configs))

          for idx, row in sorted_configs.iterrows():
              rng = np.random.default_rng(children[idx])
              m = pcg[(pcg['scaling']==row.scaling) &
                      (pcg['grid_size']==row.grid_size) &
                      (pcg['processes']==row.processes) &
                      (pcg['method']==row.method)]
              c = cg[(cg['grid_size']==row.grid_size) &
                     (cg['processes']==row.processes)]

              mt = m['total_time'].to_numpy(float)
              mk = m['iterations'].to_numpy(float)
              ct = c['total_time'].to_numpy(float)
              ck = c['iterations'].to_numpy(float)

              mi = rng.integers(0, len(mt), size=(B, len(mt)))
              ci = rng.integers(0, len(ct), size=(B, len(ct)))
              MT = mt[mi].mean(axis=1); MK = mk[mi].mean(axis=1)
              CT = ct[ci].mean(axis=1); CK = ck[ci].mean(axis=1)
              RT = MT / CT
              RK = MK / CK
              RC = (MT/MK) / (CT/CK)

              def ci95(x):
                  return np.quantile(x, [ALPHA, 1.0-ALPHA])
              rt_lo, rt_hi = ci95(RT); rk_lo, rk_hi = ci95(RK); rc_lo, rc_hi = ci95(RC)
              boot_rows.append({
                  'scaling':row.scaling, 'grid_size':int(row.grid_size),
                  'processes':int(row.processes), 'method':row.method,
                  'n_CG':int(row.n_CG), 'n_M':int(row.n_M),
                  'R_T':row.R_T, 'R_T_ci_lower':rt_lo, 'R_T_ci_upper':rt_hi,
                  'R_k':row.R_k, 'R_k_ci_lower':rk_lo, 'R_k_ci_upper':rk_hi,
                  'R_C':row.R_C, 'R_C_ci_lower':rc_lo, 'R_C_ci_upper':rc_hi,
                  'runtime_conclusion':'CG_faster' if rt_lo > 1.0 else ('M_faster' if rt_hi < 1.0 else 'inconclusive'),
                  'screening_RT_le_1_20':bool(row.R_T <= 1.20),
                  'bootstrap_seed':SEED, 'bootstrap_samples':B, 'ci_level':CL,
              })
          pd.DataFrame(boot_rows).to_csv(OUT_BOOT, index=False)

          # AS-overlap trade-off relative to matched BJ.
          base_cols = ['scaling','grid_size','processes']
          bj = pcg_sum[pcg_sum['method']=='BJ'].rename(columns={
              'T_M_mean_s':'T_BJ', 'k_M_mean':'k_BJ'
          })[base_cols+['T_BJ','k_BJ']]
          asdf = pcg_sum[pcg_sum['method'].isin(['AS1','AS2'])].merge(bj, on=base_cols, validate='many_to_one')
          asdf['iteration_reduction_pct'] = 100*(1-asdf['k_M_mean']/asdf['k_BJ'])
          asdf['time_per_iteration_change_pct'] = 100*((asdf['T_M_mean_s']/asdf['k_M_mean'])/(asdf['T_BJ']/asdf['k_BJ'])-1)
          asdf['runtime_change_pct'] = 100*(asdf['T_M_mean_s']/asdf['T_BJ']-1)
          asdf[['scaling','grid_size','processes','method','iteration_reduction_pct',
                'time_per_iteration_change_pct','runtime_change_pct']].sort_values(
                    ['scaling','grid_size','processes','method']).to_csv(OUT_TRADE,index=False)

          # Full Table-3 audit/comparison dataset from canonical PCG data.
          summary = (pcg.groupby(pcg_keys, as_index=False)
                     .agg(runs=('total_time','size'),
                          mean_iterations=('iterations','mean'),
                          iteration_values=('iterations','nunique'),
                          mean_relative_residual=('relative_residual','mean'),
                          max_relative_residual=('relative_residual','max'),
                          mean_total_time=('total_time','mean'),
                          std_total_time=('total_time','std')))
          summary['std_total_time'] = summary['std_total_time'].fillna(0.0)
          summary['cv_pct'] = 100*summary['std_total_time']/summary['mean_total_time']
          summary['mean_time_per_iteration_ms'] = 1000*summary['mean_total_time']/summary['mean_iterations']

          bj2 = summary[summary['method']=='BJ'].rename(columns={
              'mean_iterations':'bj_iterations', 'mean_total_time':'bj_total_time',
              'mean_time_per_iteration_ms':'bj_time_per_iteration_ms', 'cv_pct':'bj_cv_pct'
          })[base_cols+['bj_iterations','bj_total_time','bj_time_per_iteration_ms','bj_cv_pct']]
          trade = summary[summary['method'].isin(['AS1','AS2'])].merge(bj2,on=base_cols,validate='many_to_one')
          trade['iteration_reduction_pct'] = 100*(trade['bj_iterations']-trade['mean_iterations'])/trade['bj_iterations']
          trade['time_per_iteration_change_pct'] = 100*(trade['mean_time_per_iteration_ms']-trade['bj_time_per_iteration_ms'])/trade['bj_time_per_iteration_ms']
          trade['total_runtime_change_pct'] = 100*(trade['mean_total_time']-trade['bj_total_time'])/trade['bj_total_time']

          qcols = base_cols + ['method']
          qstatus = 'quality_check' if 'quality_check' in quality.columns else None
          if qstatus:
              quality['method'] = quality['method'].astype(str).str.upper().str.replace(' ', '', regex=False)
              trade = trade.merge(quality[qcols+[qstatus]], on=qcols, how='left', validate='one_to_one')
          else:
              trade['quality_check'] = 'PASS'

          table_cols = ['scaling','method','grid_size','processes','runs','mean_iterations',
                        'bj_iterations','mean_total_time','bj_total_time',
                        'mean_time_per_iteration_ms','bj_time_per_iteration_ms',
                        'iteration_reduction_pct','time_per_iteration_change_pct',
                        'total_runtime_change_pct','cv_pct','bj_cv_pct','quality_check']
          trade[table_cols].sort_values(['scaling','grid_size','processes','method']).to_csv(OUT_TABLE,index=False)

          # Hard checks for the corrected weak N=2048,p=64 rerun.
          w = point[(point.scaling=='weak') & (point.grid_size==2048) & (point.processes==64)]
          assert len(w)==3
          bj_rt = float(w.loc[w.method=='BJ','T_M_mean_s'].iloc[0])
          assert abs(bj_rt - 4.116894) < 1e-6, bj_rt
          tr = pd.read_csv(OUT_TRADE)
          wtr = tr[(tr.scaling=='weak') & (tr.grid_size==2048) & (tr.processes==64)]
          assert (wtr['runtime_change_pct'] > 0).all()
          print(w[['method','T_M_mean_s','R_T','R_k','R_C']].to_string(index=False))
          print(wtr[['method','iteration_reduction_pct','time_per_iteration_change_pct','runtime_change_pct']].to_string(index=False))
          PY
      - name: Commit regenerated files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            results/crossover/ratio_point_estimates.csv \
            results/crossover/ratio_bootstrap_ci.csv \
            results/crossover/pcg_tradeoff_final_validated.csv \
            results/tables/table3_overlap_all_comparisons.csv
          git commit -m 'Regenerate derived result CSVs from canonical data' || exit 0
          git push origin HEAD:phase3-mpi
